name: soundctl

# GitHub titles a run with the PR or commit title unless `run-name` is set, so
# without this every run in the Actions list is labelled with the PR title. The
# workflow name plus the branch reads better; the PR number and event stay
# visible in the run's own header.
run-name: soundctl (${{ github.head_ref || github.ref_name }})

# Build, vet and test the soundctl module (utils/soundctl) and validate the
# shipped sound definitions. The module is pure Go with no robot/network
# dependency, so all of this runs in well under a minute and catches the cheap
# mistakes (unformatted code, a YAML the firmware would reject, a missing MP3)
# before an image build or a deploy.
on:
  push:
    branches:
      - "main"
      - "releases/**"
      - "v2"
    paths:
      - "utils/soundctl/**"
      - "services"
      - "services/**"
      - "sounds/**"
      - "src/open_mower/params/sounds_*.yaml"
      - ".github/workflows/soundctl.yaml"
  pull_request:
    branches:
      - "main"
    paths:
      - "utils/soundctl/**"
      - "services"
      - "services/**"
      - "sounds/**"
      - "src/open_mower/params/sounds_*.yaml"
      - ".github/workflows/soundctl.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utils/soundctl
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # services/sound_service.json (the shared definition) is a submodule.
          submodules: "recursive"
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: utils/soundctl/go.mod
          cache-dependency-path: utils/soundctl/go.sum

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "${unformatted}" ]; then
            echo "gofmt would change:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      # The image is arm64; a cross-compile check catches anything that sneaks a
      # platform dependency (cgo, a syscall package) into the module.
      - name: cross-compile for the mower (linux/arm64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build ./...

      # Gate the shipped definitions: ids/types/ranges against the shared
      # sound_service.json, and 16 kHz mono for every referenced MP3. The
      # announcements that only a `tts:` text produces are reported as "pending"
      # (they are rendered on the mower), so no ffmpeg/engine is needed here.
      - name: validate the shipped sound definitions
        run: |
          # One entry per shipped definition; keep in lockstep with the render loop in
          # build-image.yaml. No API key and no ffmpeg needed, `--check-mp3` reports the
          # announcements that only a `tts:` text produces as "pending".
          for lang in en de fr nl pl sv; do
            go run ./cmd/soundctl validate \
              --config "../../src/open_mower/params/sounds_${lang}.yaml" \
              --sound-ids ../../services/sound_service.json \
              --sound-path ../../sounds \
              --check-mp3
          done

  # This workflow has deliberately no render job: producing the audio is the `render` job in
  # build-image.yaml, the single place that renders (its artifact feeds every image build
  # and its cache keeps the unchanged files). Moving it here, or calling it from
  # build-image.yaml, either costs money or does not work:
  #   - `needs:` links jobs of one run only, so the two options are `workflow_call` or
  #     `workflow_run`.
  #   - `workflow_call` works, but it would run this file's gofmt/vet/test/validate on every
  #     image build (they have nothing to do with an image), and a sound-only PR would render
  #     twice: once from this file's own `paths:` trigger, once from the call.
  #   - `workflow_run` only fires on the default branch and never for a pull request.
  # The real reason to want a render here would be to prove that a second run renders
  # nothing - and `tts --check` already asserts exactly that, for free (see build-image.yaml).
