name: Build OS

# Chained onto "Build" (build-image.yaml) via workflow_run, deliberately not
# a standalone pull_request/push trigger: the whole point is to vendor the
# REAL open_mower_ros image built from this exact commit/PR, not some
# unrelated ghcr tag that may not even reflect the change being tested yet.
# "Build" already does the actual arm64 build (native arm64 runner, no
# emulation) and, for PRs, exports it as an artifact (image-arm64-default --
# see push-pr-image.yaml, which consumes the same artifact the same way).
# This workflow, build-image.yaml and push-pr-image.yaml are otherwise
# completely independent -- none of those are touched here.
on:
  workflow_dispatch:
    inputs:
      build_sdcard:
        description: 'Also build the full flashable sdcard.img'
        default: false
        type: boolean
  workflow_run:
    workflows: ["Build"]
    types: [completed]

concurrency:
  # head_sha, not head_branch: a workflow_run-triggered run's own head_branch
  # is always the repo's default branch (see "Start check run" below), so
  # head_branch here would put every PR/branch's build-os run in the SAME
  # group and let one PR's push cancel a completely unrelated PR's build.
  group: build-os-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # only actually used by the release step, tag builds only
  actions: write    # cross-workflow-run artifact download (read) + deleting the
                     # stale Buildroot cache entry below (write) so it can be re-saved
  checks: write     # pin build status to the real PR/commit sha below - a
                     # workflow_run-triggered run's own head_sha/head_branch
                     # (as reported by the Actions API) is always the repo's
                     # default branch, never the PR/commit that indirectly
                     # triggered it, so callers can't find this run by
                     # querying the workflow's run list for that sha. A check
                     # run pinned explicitly to the real sha sidesteps that.

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'push'))
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Resolve PR number (if this is a PR build)
        id: pr
        if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_INFO=$(gh api "repos/${{ github.repository }}/pulls?state=all" \
            --jq ".[] | select(.head.sha == \"${{ github.event.workflow_run.head_sha }}\") | {number: .number, state: .state}" \
            | head -1)
          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')
          PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not resolve PR number for SHA ${{ github.event.workflow_run.head_sha }} (got: '${PR_NUMBER}')" >&2
            exit 1
          fi
          if [[ "$PR_STATE" != "open" ]]; then
            echo "::notice::PR #${PR_NUMBER} is already ${PR_STATE}, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"

      # Deliberately NOT gated on the PR touching os/: the RAUC bundle
      # vendors open_mower_ros wholesale (external/package/openmower-ros),
      # so a ROS-only change (no os/ touched at all) still changes what the
      # bundle actually contains -- skipping those would mean the OS build
      # is only ever validated against os/ changes, never against the ROS
      # payload it ships, which is most of what actually goes into it. The
      # PR-closed check below still applies (a workflow_run can fire after
      # the PR that triggered it already closed/merged).
      - name: Should this run proceed?
        id: go
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.workflow_run.event }}" = "pull_request" ]; then
            if [ "${{ steps.pr.outputs.skip }}" != "true" ]; then
              echo "go=true" >> "$GITHUB_OUTPUT"
            else
              echo "go=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned to the real commit sha (not this run's own head_sha, which is
      # always the default branch for a workflow_run trigger - see the
      # concurrency/permissions comments above), so a caller can look this
      # run up later via GET /commits/{sha}/check-runs regardless of which
      # branch build-os itself thinks it ran on. external_id carries this
      # exact run's own id (github.run_id, known now even though this run's
      # own API-reported head_sha isn't usable for the lookup) so the caller
      # can jump straight to its artifacts without re-deriving anything -
      # NOT details_url/html_url: GitHub silently forces both of those to the
      # check run's own page for check runs created via the Actions token,
      # ignoring whatever URL you pass. external_id is the field actually
      # meant for "the integrator's own reference for this run" and isn't
      # overridden.
      - name: Start check run
        if: steps.go.outputs.go == 'true'
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/check-runs" \
            -f name="OS Build" \
            -f head_sha="$SHA" \
            -f status=in_progress \
            -f external_id="${{ github.run_id }}" \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.go.outputs.go == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive
          fetch-depth: 0   # need tag history to tell a release tag from an ordinary branch push, below
          fetch-tags: true

      - name: Free up disk space
        if: steps.go.outputs.go == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      # Tag pushes (v*, same tags build-image.yaml itself reacts to) get the
      # full flashable sdcard.img and a GitHub Release; everything else
      # (PR builds, ordinary branch pushes, or a manual dispatch that didn't
      # ask for it) only builds the RAUC bundle -- see post-image.sh:
      # skipping sdcard assembly skips ~8GB of pure disk-image
      # allocation/writing the bundle doesn't need at all.
      - name: Determine build mode
        if: steps.go.outputs.go == 'true'
        id: mode
        run: |
          is_release=false
          if [ "${{ github.event.workflow_run.event }}" = "push" ] && git tag --points-at HEAD | grep -qE '^v'; then
            is_release=true
          fi
          if [ "$is_release" = "true" ] || [ "${{ inputs.build_sdcard }}" = "true" ]; then
            echo "build_sdcard=1" >> "$GITHUB_OUTPUT"
          else
            echo "build_sdcard=0" >> "$GITHUB_OUTPUT"
          fi
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

      # PRs: vendor the exact image "Build" just built from this PR's own
      # source (see the header comment above) instead of an unrelated ghcr
      # tag. Branch/tag pushes: "Build"'s own merge job has, by the time
      # this workflow_run fired, already pushed a `sha-<short-sha>` tag for
      # every push it handles (edge/branch/semver/sha are all applied
      # together, see build-image.yaml's Docker meta step) -- always
      # present regardless of branch vs. tag, so no need to special-case
      # which one this is.
      - name: Fetch the open_mower_ros image built from this commit (PR)
        if: steps.go.outputs.go == 'true' && github.event.workflow_run.event == 'pull_request'
        uses: actions/download-artifact@v4
        with:
          name: image-arm64-default
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Load the PR image and point the OS build at it
        if: steps.go.outputs.go == 'true' && github.event.workflow_run.event == 'pull_request'
        run: |
          docker load < image.tar
          echo "OMR_SOURCE=local-image" >> "$GITHUB_ENV"
          echo "OMR_IMAGE=open_mower-pr:default" >> "$GITHUB_ENV"

      - name: Point the OS build at this commit's published image (branch/tag push)
        if: steps.go.outputs.go == 'true' && github.event.workflow_run.event == 'push'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          echo "OMR_SOURCE=ghcr" >> "$GITHUB_ENV"
          echo "OMR_IMAGE=ghcr.io/${REPOSITORY,,}:sha-${sha:0:7}" >> "$GITHUB_ENV"

      # Stable CI signing identity instead of build.sh's own default (a
      # fresh throwaway keypair generated every run and discarded with the
      # runner -- self-consistent within one run, useless across runs: no
      # future CI build can ever produce an update signed with a key that
      # no longer exists). NOT the production key -- that stays offline per
      # the README ("Production: sign with an offline CA"); this is a
      # dedicated CI dev key, distinct from any individual's own local
      # keys/dev-cert.pem, so CI-built artifacts are at least
      # self-consistent across runs. Falls through to build.sh's own
      # generate-on-demand default if the secrets aren't set.
      - name: Install the CI dev signing key
        if: steps.go.outputs.go == 'true'
        env:
          RAUC_CI_DEV_CERT: ${{ secrets.RAUC_CI_DEV_CERT }}
          RAUC_CI_DEV_KEY: ${{ secrets.RAUC_CI_DEV_KEY }}
        run: |
          if [ -z "$RAUC_CI_DEV_CERT" ]; then
            echo "No RAUC_CI_DEV_CERT secret set, falling back to build.sh's own throwaway key"
            exit 0
          fi
          mkdir -p os/keys
          printf '%s' "$RAUC_CI_DEV_CERT" > os/keys/dev-cert.pem
          printf '%s' "$RAUC_CI_DEV_KEY" > os/keys/dev-key.pem
          chmod 600 os/keys/dev-key.pem

      # Single fixed key, not key-per-run: actions/cache never overwrites an
      # existing key, so a per-run key (os-build-${{ github.run_id }}) leaves
      # a fresh ~6GB blob behind on every run that nothing ever deletes. That
      # competes with build-image.yaml's docker buildx cache for the same
      # repo-wide 10GB cache pool; once combined usage tips over the cap,
      # GitHub evicts whichever cache was least-recently touched -- and since
      # this workflow runs far less often than "Build" (which writes to its
      # cache on nearly every push/PR), this cache is always the one evicted,
      # sometimes before a second run ever gets to reuse it. Fixed key avoids
      # the pile-up; see the delete+save steps below (after Build) for how it
      # still gets updated despite the "never overwrites a key" restriction.
      #
      # Explicit restore, not the combined actions/cache@v4 (restore + an
      # automatic post-job save): that combo is what save-always was for, and
      # the deprecation warning it prints ("save-always does not work as
      # intended ... a separate actions/cache/restore step should be used
      # instead") is not a formality -- the automatic post-save is unreliable
      # exactly when this job gets cancelled by a concurrency-group
      # cancel-in-progress (new push while a build is still running, which
      # happens a lot here given how long these builds take). Explicit save
      # steps gated on if: always() below don't have that problem: GitHub
      # only force-kills the step that's actively running at cancel time,
      # steps after it guarded by always() still run normally.
      - name: Restore Buildroot cache
        if: steps.go.outputs.go == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            os/.cache/dl
            os/.cache/ccache
            os/.cache/openmower-cli
            os/output/build
            os/output/host
          key: os-build

      # OMR_SOURCE/OMR_IMAGE come from GITHUB_ENV (set above); ghcr's own
      # default fallback in build.sh only applies if neither step above ran
      # (workflow_dispatch), which is exactly when the ghcr default is
      # actually what you want.
      - name: Build
        if: steps.go.outputs.go == 'true'
        id: build
        working-directory: os
        env:
          OPENMOWER_BUILD_SDCARD: ${{ steps.mode.outputs.build_sdcard }}
        run: ./build.sh image

      # if: always() (not steps.go.outputs.go == 'true' alone) so this still
      # runs when Build fails or the job gets cancelled mid-Build -- a failed
      # or cancelled build has still done most of the slow work (downloads,
      # ccache, output/build|host), which is exactly what a following
      # debugging run wants restored. Delete-then-save (rather than one
      # combined step) because actions/cache/save also silently no-ops on an
      # existing key -- must clear it first so the save below actually lands.
      - name: Delete stale Buildroot cache entry
        if: always() && steps.go.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache delete os-build --repo "${{ github.repository }}" || true

      - name: Save Buildroot cache
        if: always() && steps.go.outputs.go == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            os/.cache/dl
            os/.cache/ccache
            os/.cache/openmower-cli
            os/output/build
            os/output/host
          key: os-build

      - name: Upload RAUC bundle
        if: steps.go.outputs.go == 'true'
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: openmower-os-raucb
          path: os/output/images/openmower-*.raucb
          if-no-files-found: error
          retention-days: 14

      # After the RAUC bundle upload (not right after Build) so a caller
      # that sees this check run go "completed"/"success" can already find
      # the artifact - no window where the check looks done but the upload
      # hasn't landed yet. always() so failed/cancelled builds still get
      # marked, matching the cache-save steps' reasoning above. Requires the
      # upload step to have succeeded too, not just Build - Build succeeding
      # doesn't guarantee the artifact actually made it up.
      # Status check functions like cancelled() only parse inside `if:` - not
      # in a `${{ }}` expression anywhere else (confirmed the hard way: using
      # it inline in the run script below made the whole workflow file
      # rejected as invalid at dispatch time). Split into two mutually
      # exclusive steps instead of branching on it inside one script.
      #
      # CHECK_RUN_ID/REPO go through env (not interpolated straight into the
      # script) so the shell only ever sees a github-generated numeric id and
      # "owner/repo" string, never a raw ${{ }} expansion in the script text
      # itself - the actual injection risk here is negligible (nothing here
      # is attacker-influenced text like a PR title), but it's what the rest
      # of this file already does (e.g. the SHA env var above) and zizmor
      # flags any direct ${{ }} in a run: block on principle either way.
      - name: Finish check run (cancelled)
        if: always() && steps.go.outputs.go == 'true' && cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check.outputs.id }}
        run: |
          gh api --method PATCH "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -f status=completed \
            -f conclusion=cancelled >/dev/null

      - name: Finish check run
        if: always() && steps.go.outputs.go == 'true' && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CHECK_RUN_ID: ${{ steps.check.outputs.id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          if [ "$BUILD_OUTCOME" = "success" ] && [ "$UPLOAD_OUTCOME" = "success" ]; then
            conclusion=success
          else
            conclusion=failure
          fi
          gh api --method PATCH "repos/$REPO/check-runs/$CHECK_RUN_ID" \
            -f status=completed \
            -f conclusion="$conclusion" >/dev/null

      - name: Upload sdcard.img
        if: steps.go.outputs.go == 'true' && steps.mode.outputs.build_sdcard == '1'
        uses: actions/upload-artifact@v4
        with:
          name: openmower-os-sdcard
          path: os/output/images/sdcard.img
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: steps.go.outputs.go == 'true' && steps.mode.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: |
            os/output/images/openmower-*.raucb
            os/output/images/sdcard.img
