name: Build

# See soundctl.yaml: without `run-name`, every run in the Actions list carries
# the PR or commit title instead of the workflow name.
run-name: Build (${{ github.head_ref || github.ref_name }})

# Controls when the workflow will run
on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: "Clean build without cache"
        default: false
        type: boolean
      variant:
        description: "Which variant to build (default/legacy or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - default
          - legacy
      arch:
        description: "Which architecture to build (amd64/arm64 or all)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - amd64
          - arm64
  push:
    branches:
      - "main"
      - "releases/**"
      - "v2"
    tags:
      - "v*"
  pull_request:
    branches:
      - "main"

# Allow stopping obsolete workflows
concurrency:
  group: ci-buildtrain-${{ github.ref }}-1
  cancel-in-progress: true

# permissions are needed if pushing to ghcr.io
permissions:
  packages: write

jobs:
  # One render for the whole run. Every build job consumes its artifact, so a definition
  # change costs its TTS requests exactly once - and the render cache above it keeps every
  # unchanged file, so an unchanged definition costs nothing at all.
  #
  # Why a separate job: rendering is the only step that spends money, so it happens here
  # once and every build job copies the result instead of requesting it again.
  render:
    runs-on: ubuntu-latest
    # A legacy-only rebuild has no announcements to render: do not spend a request on it.
    if: github.event_name != 'workflow_dispatch' || inputs.variant != 'legacy'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # services/sound_service.json (the shared definition) is a submodule.
          submodules: "recursive"
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: utils/soundctl/go.mod
          cache-dependency-path: utils/soundctl/go.sum

      # The render encodes the announcements (EBU R128 + MP3) with ffmpeg, which the image
      # has but the runner does not.
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      # The renders are their own cache: soundctl writes a .json sidecar next to every MP3
      # and only re-renders a variant whose fingerprint (engine, model, voice, voice
      # settings, bitrate, language, text, see fwsync.TTSIdentity.Key) changed.
      #
      # ⚠️  A cache entry is immutable per key: the *first* save wins, and a later save for
      # the same key fails silently ("Unable to reserve cache"). A key derived from the
      # inputs alone therefore pins whatever the first run produced — one run whose TTS key
      # ran out of quota poisons that key for good: every later run restores the stale
      # renders, spends the API requests again and cannot store the result. So the save key
      # is unique per run and the restore only uses the shared prefix: any entry is a valid
      # seed, and the sidecars decide what still has to be rendered.
      - name: Restore the rendered announcements
        id: tts_cache
        uses: actions/cache/restore@v6
        with:
          # Only the per-language render directories: the tracked recordings
          # (zz_*.mp3, README.md) come from the checkout, not from a cache.
          path: |
            sounds/en
            sounds/de
          key: tts-renders-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tts-renders-

      # A step's `if` cannot read a secret directly, so detect it in its own step.
      - name: Check for the TTS keys
        id: tts_key
        env:
          ELEVEN: ${{ secrets.ELEVENLABS_API_KEY }}
          CARTESIA: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          if [ -n "${ELEVEN}" ] || [ -n "${CARTESIA}" ]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::No ELEVENLABS_API_KEY / CARTESIA_API_KEY secret - this build ships without the announcements (the robot renders them with its own key)."
          fi

      # Best effort on purpose: a failed render (API down, licence, rate limit) keeps the
      # previous file and must not stop the image build. The job still reports it below,
      # `soundctl tts --check` names what is stale, and at runtime `soundctl sync` skips
      # those files - so the low level keeps playing what it already has.
      - name: Render the announcements
        id: render
        if: steps.tts_key.outputs.available == 'true'
        continue-on-error: true
        working-directory: utils/soundctl
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
        run: |
          set -euo pipefail
          go build -o "${RUNNER_TEMP}/soundctl" ./cmd/soundctl
          # Each language renders with the engine its file names, and each engine has its
          # own secret: skip a language whose key is missing so it cannot hide the other.
          declare -A secret=([elevenlabs]="${ELEVENLABS_API_KEY:-}" [cartesia]="${CARTESIA_API_KEY:-}")
          failed=0
          for lang in en de; do
            cfg="../../src/open_mower/params/sounds_${lang}.yaml"
            engine=$(sed -n 's/^[[:space:]]*engine:[[:space:]]*\([a-z]*\).*/\1/p' "${cfg}" | head -1)
            if [ -z "${engine}" ]; then
              echo "::error::could not read tts.engine from ${cfg}"
              failed=1
              continue
            fi
            if [ -z "${secret[${engine}]:-}" ]; then
              echo "::notice::sounds_${lang}.yaml uses '${engine}', but its key is not set - skipping the ${lang} render."
              continue
            fi
            args=(--config "${cfg}"
                  --sound-ids ../../services/sound_service.json
                  --sound-path ../../sounds
                  --sounds-dir ../../sounds)
            # --keep-going: try every variant, so the log names all failures instead of
            # stopping at the first one.
            "${RUNNER_TEMP}/soundctl" tts --keep-going "${args[@]}" || failed=1
            # Nothing may be left stale, and every render must be 16 kHz mono.
            "${RUNNER_TEMP}/soundctl" tts --check "${args[@]}" || failed=1
            "${RUNNER_TEMP}/soundctl" validate --check-mp3 "${args[@]}" || failed=1
          done
          exit "${failed}"

      # Without a key nothing was rendered: drop whatever the cache restored. An image with
      # audio from an older definition looks fine and only fails much later - `soundctl sync`
      # refuses to upload a stale render, so the robot stays silent instead of playing
      # something that is not in the YAML.
      - name: Drop restored renders when there is no key
        if: steps.tts_key.outputs.available != 'true'
        run: rm -rf sounds/en sounds/de

      # Save even when the render failed: whatever is there is what the next run reuses, so
      # an unchanged definition costs no TTS request. The key is the one the restore step
      # reported, i.e. unique per run (a deterministic key would only ever store the first
      # attempt, see the restore step above).
      - name: Save the rendered announcements
        if: ${{ !cancelled() && steps.tts_key.outputs.available == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: |
            sounds/en
            sounds/de
          key: ${{ steps.tts_cache.outputs.cache-primary-key }}

      # The artifact is the hand-over to the build jobs: they all wait for this job and
      # unpack it into sounds/, so exactly one render per run reaches every image.
      - name: Upload the rendered announcements
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sounds
          path: |
            sounds/en
            sounds/de
          # No key, no renders: the artifact is simply empty and the build jobs tolerate
          # that (the robot renders the announcements itself).
          if-no-files-found: ignore
          retention-days: 3

      # A red step inside a green job is easy to miss, and the PR image is only pushed for a
      # successful build - so the failure is also stated as a check annotation.
      - name: Report an incomplete render
        if: steps.render.outcome == 'failure'
        run: |
          echo "::warning title=Announcements not rendered::The render failed (see the step above); the image ships whatever the cache had."
          echo "Some announcements could not be rendered - the image ships what the cache had." >> "${GITHUB_STEP_SUMMARY}"

  build:
    needs: render
    # An incomplete render must not block the image (it ships whatever was cached, and the
    # robot copes with stale files): only a cancelled run skips the build.
    if: ${{ always() && needs.render.result != 'cancelled' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            docker_build_arch: arm64
            variant: legacy
            dockerfile: ./docker/Dockerfile.Legacy
          - os: ubuntu-24.04
            docker_build_arch: amd64
            variant: legacy
            dockerfile: ./docker/Dockerfile.Legacy
          - os: ubuntu-24.04-arm
            docker_build_arch: arm64
            variant: default
            dockerfile: ./docker/Dockerfile
          - os: ubuntu-24.04
            docker_build_arch: amd64
            variant: default
            dockerfile: ./docker/Dockerfile
    steps:
      - name: Prepare
        env:
          REPOSITORY: "${{ github.repository }}"
        run: |
          build_arch=${{ matrix.docker_build_arch }}
          echo "BUILD_ARCH=${build_arch//\//-}" >> ${GITHUB_ENV}

          echo "REPOSITORY_LC=${REPOSITORY,,}" >> ${GITHUB_ENV}

      # Get the repository's code
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: "recursive"
          # Full history + tags so `git describe` can resolve the real version below.
          fetch-depth: 0
          persist-credentials: false

      # Compute the software version here (git is available in the runner, but the
      # Docker build context excludes .git/, so the container can't compute it itself).
      - name: Compute version
        id: version
        run: |
          version=$(git describe --tags 2>/dev/null || git describe --always 2>/dev/null || echo v0.0.0)
          echo "version=${version}" >> ${GITHUB_OUTPUT}
          echo "Software version: ${version}"

      # The announcements come from the single render job above, as an artifact: no build
      # job spends a TTS request (see the cache note there). Without a TTS secret the job
      # uploads nothing and the image ships without announcements - the robot renders them
      # itself with the user's own key.
      - name: Download the rendered announcements
        if: matrix.variant == 'default'
        uses: actions/download-artifact@v4
        with:
          name: sounds
          path: sounds
        continue-on-error: true

      # Setup Python 3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3"

      - uses: pre-commit/action@v3.0.1

      - name: Docker meta
        if: matrix.variant == 'default'
        id: meta_default
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY_LC }}
          flavor: |
            latest=false

      - name: Docker meta (Legacy)
        if: matrix.variant == 'legacy'
        id: meta_legacy
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.REPOSITORY_LC }}
          flavor: |
            latest=false
            suffix=-legacy

      - name: Select metadata labels
        if: github.event_name != 'workflow_dispatch' || ((inputs.variant == 'all' || inputs.variant == matrix.variant) && (inputs.arch == 'all' || inputs.arch == matrix.docker_build_arch))
        run: |
          if [ "${{ matrix.variant }}" = "default" ]; then
            echo "META_LABELS=${{ steps.meta_default.outputs.labels }}" >> ${GITHUB_ENV}
          else
            echo "META_LABELS=${{ steps.meta_legacy.outputs.labels }}" >> ${GITHUB_ENV}
          fi

      # https://github.com/docker/setup-buildx-action
      - name: Set up Docker Buildx
        if: github.event_name != 'workflow_dispatch' || ((inputs.variant == 'all' || inputs.variant == matrix.variant) && (inputs.arch == 'all' || inputs.arch == matrix.docker_build_arch))
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || ((inputs.variant == 'all' || inputs.variant == matrix.variant) && (inputs.arch == 'all' || inputs.arch == matrix.docker_build_arch)))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || ((inputs.variant == 'all' || inputs.variant == matrix.variant) && (inputs.arch == 'all' || inputs.arch == matrix.docker_build_arch)))
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.docker_build_arch }}
          build-args: |
            OM_SOFTWARE_VERSION=${{ steps.version.outputs.version }}
          no-cache: ${{ inputs.clean_build == true || false }}
          labels: ${{ env.META_LABELS }}
          outputs: type=image,name=ghcr.io/${{ env.REPOSITORY_LC }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.os }}-${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.os }}-${{ matrix.variant }},mode=max

      - name: Build and export (PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.docker_build_arch }}
          build-args: |
            OM_SOFTWARE_VERSION=${{ steps.version.outputs.version }}
          tags: open_mower-pr:${{ matrix.variant }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha,scope=${{ matrix.os }}-${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.os }}-${{ matrix.variant }},mode=max

      - name: Upload image tar (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ env.BUILD_ARCH }}-${{ matrix.variant }}
          path: /tmp/image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Export digest
        if: (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || ((inputs.variant == 'all' || inputs.variant == matrix.variant) && (inputs.arch == 'all' || inputs.arch == matrix.docker_build_arch)))
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build-and-push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: (github.event_name != 'pull_request') && (github.event_name != 'workflow_dispatch' || ((inputs.variant == 'all' || inputs.variant == matrix.variant) && (inputs.arch == 'all' || inputs.arch == matrix.docker_build_arch)))
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.BUILD_ARCH }}-${{ matrix.variant }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs:
      - build
    strategy:
      matrix:
        include:
          - variant: default
          - variant: legacy
    steps:
      - name: Prepare
        env:
          REPOSITORY: "${{ github.repository }}"
        run: |
          echo "REPOSITORY_LC=${REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Download digests
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*-${{ matrix.variant }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker meta (Default)
        if: (matrix.variant == 'default') && (github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant)
        id: meta_default
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=edge,branch=main
            type=schedule
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
          images: ghcr.io/${{ env.REPOSITORY_LC }}
          flavor: |
            latest=auto

      # Legacy — all tags suffixed with -legacy, no `latest`
      - name: Docker meta (Legacy)
        if: (matrix.variant == 'legacy') && (github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant)
        id: meta_legacy
        uses: docker/metadata-action@v5
        with:
          tags: |
            type=edge,branch=main,prefix=releases-
            type=schedule,suffix=-legacy
            type=ref,event=branch,suffix=-legacy
            type=ref,event=pr,suffix=-legacy
            type=semver,pattern={{version}},suffix=-legacy
            type=semver,pattern={{major}}.{{minor}},suffix=-legacy
            type=semver,pattern={{major}},suffix=-legacy
            type=sha,suffix=-legacy
          images: ghcr.io/${{ env.REPOSITORY_LC }}
          flavor: |
            latest=false

      - name: Login to GHCR
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant
        id: manifest
        working-directory: /tmp/digests
        run: |
          echo "Found digest files:" && ls -la || true
          if [ "$(ls -1 | wc -l)" -eq 0 ]; then
            echo "No digests found, skipping manifest creation for ${{ matrix.variant }}"
            exit 0
          fi
          TAG_ARGS=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          echo "Creating manifest with tags: $TAG_ARGS"
          # --metadata-file captures the manifest list's own content-addressed
          # digest -- the OS build dispatch below needs THAT (immutable),
          # not one of the tags above (mutable: a short-sha tag could in
          # principle be replaced by a later rebuild, and the receiver has
          # no way to tell it happened).
          docker buildx imagetools create --metadata-file /tmp/manifest-metadata.json ${TAG_ARGS} \
            $(printf 'ghcr.io/${{ env.REPOSITORY_LC }}@sha256:%s ' *)
          echo "digest=$(jq -r '."containerimage.descriptor".digest' /tmp/manifest-metadata.json)" >> "$GITHUB_OUTPUT"

      - name: Inspect image
        if: github.event_name != 'workflow_dispatch' || inputs.variant == 'all' || inputs.variant == matrix.variant
        run: |
          docker buildx imagetools inspect $(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

      # Trigger the OS/RAUC build in ClemensElflein/OpenMower now that a
      # public image exists for it to pull. Only the default variant is
      # ever vendored into the OS image (systemd-based, current -- the
      # legacy variant has no OS build equivalent), and only once per push
      # (not once per matrix entry), hence the variant guard here rather
      # than a separate job. is_release/tag_name come straight from this
      # push's own ref (github.ref_type/ref_name), not a re-derived git-tag
      # lookup -- unlike a workflow_run-triggered workflow, this job runs
      # directly off the push event, so that context is already
      # trustworthy without an extra checkout.
      - name: Trigger OS build
        # A workflow_dispatch filtered to a single arch (inputs.arch !=
        # 'all') pushes a single-platform manifest -- OpenMower always
        # pulls --platform linux/arm64, so dispatching from an amd64-only
        # manual run would hand it an image with no arm64 to pull at all.
        if: matrix.variant == 'default' && (github.event_name != 'workflow_dispatch' || (inputs.variant == 'all' || inputs.variant == matrix.variant) && inputs.arch == 'all')
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
          # api.openmower.de has exactly three modes (PR/BRANCH/TAG) --
          # ref_type is 'tag' for any tag push (this workflow only ever
          # triggers on 'v*' tags, see the top-level `on:` block), 'branch'
          # otherwise. is_release is a separate concern: whether to also
          # cut a GitHub Release, not what mode this build is in.
          EVENT: ${{ github.ref_type == 'tag' && 'TAG' || 'BRANCH' }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          IS_RELEASE: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
          # This repo, not OpenMower's own -- client_payload[sha] is a commit
          # here, and OpenMower only knows that because it's the one pulling
          # the image; without this it has no way to link back to the
          # open_mower_ros commit that produced it.
          SOURCE_REPO: ${{ github.repository }}
        run: |
          if [ -z "$DIGEST" ]; then
            echo "No manifest digest (manifest step skipped, e.g. a filtered workflow_dispatch run) -- nothing to dispatch"
            exit 0
          fi
          # By digest, not one of the tags above -- tags are mutable
          # (mode=default's own docker meta writes several onto the same
          # manifest, and a short-sha tag could in principle be reused by
          # a later rebuild), so this is the only reference guaranteed to
          # still match client_payload[sha] by the time OpenMower pulls it.
          IMAGE="ghcr.io/${REPOSITORY_LC}@${DIGEST}"
          gh api --method POST /repos/ClemensElflein/OpenMower/dispatches \
            -f event_type=os-build \
            -f "client_payload[event]=$EVENT" \
            -f "client_payload[ref]=$REF" \
            -f "client_payload[sha]=$SHA" \
            -f "client_payload[image]=$IMAGE" \
            -F "client_payload[is_release]=$IS_RELEASE" \
            -f "client_payload[tag_name]=$([ "$IS_RELEASE" = "true" ] && echo "$REF" || echo "")" \
            -f "client_payload[source_repo]=$SOURCE_REPO"
