name: Seed sound store

# One-off tool: fill ghcr.io/<repo>/tts-sounds from an image that already contains the
# renders, so switching the render job from actions/cache to the registry does not
# re-render the whole corpus (~370 TTS requests).
#
# It never overwrites a language that is already stored unless `force` is set, so running
# it again is harmless.
#
# Why the `push` trigger: workflow_dispatch is only listed in the UI once this file is on
# the default branch. The push trigger - filtered to this very file - makes it runnable
# from a feature branch without a merge. Remove that block once this landed on main; the
# dispatch trigger alone is the long-term interface.

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image that carries the renders (default: ghcr.io/<repo>:latest)"
        required: false
        type: string
      force:
        description: "Overwrite languages that are already stored"
        required: false
        default: false
        type: boolean
  push:
    paths:
      - ".github/workflows/seed-sound-store.yaml"

permissions:
  contents: read
  packages: write

env:
  SOUNDS_PACKAGE: ${{ github.repository }}/tts-sounds
  # One entry per shipped definition; keep in step with render-sounds.yaml.
  SOUND_LANGUAGES: en de fr nl pl sv

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Set up oras
        uses: oras-project/setup-oras@v1

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GH_TOKEN}" | oras login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      # The renders live in the image because the render job writes them into the build
      # context (`sounds/`) and Dockerfile copies it to /opt/open_mower_ros.
      - name: Extract the renders from the image
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          image="${INPUT_IMAGE:-ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]'):main}"
          echo "seeding from ${image}"
          docker pull "${image}"
          id=$(docker create "${image}")
          mkdir -p "${RUNNER_TEMP}/sounds"
          docker cp "${id}:/opt/open_mower_ros/sounds/." "${RUNNER_TEMP}/sounds/"
          docker rm -v "${id}"
          ls -1 "${RUNNER_TEMP}/sounds"

      - name: Store one tag per language
        env:
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          force="${INPUT_FORCE:-false}"
          pkg=$(echo "${SOUNDS_PACKAGE}" | tr '[:upper:]' '[:lower:]')
          stored=0
          skipped=0
          missing=0
          for lang in ${SOUND_LANGUAGES}; do
            ref="ghcr.io/${pkg}:${lang}"
            if [ ! -d "${RUNNER_TEMP}/sounds/${lang}" ]; then
              echo "::warning::the image has no sounds/${lang} - nothing to seed for it"
              missing=$((missing + 1))
              continue
            fi
            if [ "${force}" != "true" ] && oras manifest fetch "${ref}" >/dev/null 2>&1; then
              echo "keeping ${lang} (already stored; set force=true to overwrite)"
              skipped=$((skipped + 1))
              continue
            fi
            # Deterministic tar: identical content gives an identical blob digest, so a
            # second seed of the same content uploads nothing.
            tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
              -cf - -C "${RUNNER_TEMP}/sounds" "${lang}" | gzip -n > "${RUNNER_TEMP}/${lang}.tgz"
            oras push "${ref}" "${RUNNER_TEMP}/${lang}.tgz:application/vnd.oci.image.layer.v1.tar+gzip"
            stored=$((stored + 1))
          done
          echo "::notice::seeded ${stored}, kept ${skipped}, missing ${missing}"
