name: Clear cache

# Manual helper: deletes the repository's Actions caches. Without a prefix everything is
# removed - including the render cache, which then has to be rebuilt with TTS requests
# (see the render job in build-image.yaml), so use the prefix to clear a single family.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Only delete keys that start with this text (empty: every cache)"
        required: false
        default: ""

# Deletes caches, so it needs write permission on actions.
permissions:
  actions: write

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Clear cache
        uses: actions/github-script@v8
        with:
          script: |
            const prefix = context.payload.inputs?.prefix ?? "";
            console.log(`About to clear caches${prefix ? ` starting with '${prefix}'` : ""}`);
            let deleted = 0;
            // Delete page by page and re-list after every page: deleting changes the
            // listing, and the API returns at most 100 entries per request.
            for (;;) {
              const list = await github.rest.actions.getActionsCacheList({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              });
              const caches = list.data.actions_caches.filter((c) => c.key.startsWith(prefix));
              if (caches.length === 0) {
                break;
              }
              for (const cache of caches) {
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
                deleted++;
                console.log(`deleted ${cache.key}`);
              }
            }
            console.log(`Clear completed: ${deleted} cache(s)`);
