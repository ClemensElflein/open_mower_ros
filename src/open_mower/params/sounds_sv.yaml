# sounds_sv.yaml — Sound-Overrides for the HW v2 sound system.
#
# The low-level ROM defaults (TONE/SEQUENCE) stay untouched in the firmware
# (fw: src/drivers/sound/sound_definition.hpp).
#
# This file only lists the sounds that shall REPLACE a ROM default.
#
# ---------------------------------------------------------------------------
# CUSTOMISING SOUNDS — READ THIS FIRST (nothing to do otherwise)
# ---------------------------------------------------------------------------
# Every announcement is rendered and uploaded by the robot itself: `soundctl tts`
# renders the tts variants into the writable overlay (/data/sounds/<language>/)
# at startup, `soundctl sync` uploads them to the low level. A changed text, voice
# or voice setting re-renders only that file (a .json sidecar next to the MP3 is
# the cache), and syncing refuses to upload a stale render.
#
# The overlay is NOT persistent on a stock OpenMower: the docker compose mounts
# /data/ros, /data/recordings and /data/params individually, so /data/sounds lives
# in the container and is gone after `openmower restart`. That is harmless for the
# shipped sounds (they are re-rendered), but it also drops your own MP3s and the
# key file of the engine this file names. To keep both, mount the directory from
# the host:
#
#   openmower@openmower:~ $ mkdir ~/sounds
#   openmower@openmower:~ $ nano /opt/stacks/openmower/compose.yaml
#   and add a `- /home/openmower/sounds:/data/sounds` next to the other volumes.
#   openmower@openmower:~ $ echo 'sk-...' > ~/sounds/.elevenlabs.key
#   openmower@openmower:~ $ chmod 600 ~/sounds/.elevenlabs.key
#   openmower@openmower:~ $ openmower restart
#
# Switching this file to `engine: cartesia` means writing ~/sounds/.cartesia.key
# (`sk_car_...`) instead.
# ---------------------------------------------------------------------------
#
# Per-sound fields (all optional except type/volume):
#   type       tone | sequence | mp3
#   volume     0..100 (the master volume scales on top)
#   waveform   sine | square | triangle | saw   (tone/sequence)
#   unison     detuned voices, 1/3/5/7         (thickens the sound)
#   detune_hz  frequency spread between them
#   attack_ms  sequence: fade-in at the start of every note, 0..255 ms
#              (0 = instant onset, ~5 ms removes the click of a hard start)
#   decay_ms   sequence: fade-out of every note, 0..255 ms
#              (0 = hold the note at full level until its duration is over).
#              The fade is exponential and reaches about -60 dB after that time,
#              so a single note with a decay is a "ping" that rings out instead
#              of a hard-gated rectangle.
#   repeat_ms  repeat the sound every n ms until another sound plays, 0..65535
#              (0 = play once). The firmware player repeats it itself, so the
#              request queue is not involved; the ROM default uses it for
#              BOOT_PING (every 2 s while Stage 2 waits for ROS).
#   pause_after_ms  silence for that long after THIS sound ended, before the next
#              queued sound starts, 0..65535 (0 = play through). For sounds that
#              need a little room to breathe, e.g. an announcement that should not
#              be followed by the next one right away. `stop()` (the state machine
#              before an alert, or `soundctl stop`) cuts it short; a repeating
#              sound (repeat_ms) does not pause between its own iterations.
#   variants   mp3: the playable takes of this sound, one list entry per take
#                - "text to speak"      a tts variant: soundctl renders it
#                - {file: name.mp3}     an existing recording (below sound_path)
#              A tts variant is stored as <language>_<sound>_<n>.mp3, so a sound
#              with two texts produces en_boot_complete_1.mp3 and _2.mp3. A file
#              name must be plain (no path), end in .mp3 and be at most 55 chars.
#   pick       which variant the low level plays: random (default), rotate (never
#              the same twice in a row) or first. Until the firmware knows the
#              list it plays the first variant, so a multi-variant sound is
#              already fully uploaded and just not yet varied.
#   every      duration such as "120s": the low level rolls by itself once per
#              interval whether to play this sound - background ambience. Without
#              every, a sound only plays when the high level requests it.
#   chance     0..1, the probability of playing after such a roll (needs every).
#
# sound_path: high-level directory holding the local MP3 source files (used
#             for the 16 kHz/mono check and as the upload source). It is NOT
#             transmitted to the LL. The LL path is a fixed contract:
#             /sounds/<file> (hardcoded in the firmware and the upload tool).
#             Files that are customised on the robot live in the writable
#             overlay (/data/sounds, or --sounds-dir) and take precedence over
#             the ones shipped here — nothing is copied back and forth. A file
#             is looked up in <overlay>/<language>, <sound_path>/<language>,
#             <overlay>, <sound_path> — in that order. Outside the image that
#             path does not exist, so a run from a checkout passes
#             `--sound-path sounds` (or sets OPENMOWER_SOUNDS_DIR for the
#             writable overlay).
#
# language: subdirectory of sound_path/the overlay that holds the renders of
#           this language (sounds/<language>/), and the language hint handed to
#           the engine (`language_code` for ElevenLabs, `language` for Cartesia)
#           so it does not have to guess from a three-word announcement -
#           Swedish/Danish/Norwegian and Dutch/German/Afrikaans are close enough
#           for a wrong guess. Its texts are in this language. It is part of the
#           render cache key, so changing it re-renders this file.
#
# tts:      how the tts variants of THIS file are spoken. Engine-agnostic options
#           are flat, everything that belongs to ElevenLabs sits in the
#           elevenlabs block. All of it is part of the render cache key, so
#           changing one re-renders every announcement of this file.
#   engine     elevenlabs or cartesia
#   bitrate    MP3 bitrate, e.g. 32k/48k/64k (CBR, 16 kHz mono, keep it small)
#   loudnorm   EBU R128 to -16 LUFS, so all announcements are equally loud
#   elevenlabs
#     model    ElevenLabs model id: eleven_v4 (quality), eleven_multilingual_v2
#              (most stable, the API default) or eleven_flash_v2_5 (cheap/fast)
#     voice    voice id (not a name); `soundctl tts voices` lists them
#     stability / similarity_boost / style   0..1, use_speaker_boost  true|false
#   cartesia
#     model    Sonic model id; the default is the release alias sonic-3.6, so the
#              set follows the newest stable 3.6 build. A dated id pins one
#              build (sonic-3.6-2026-08-27); `GET /models` lists only the aliases.
#              Cartesia does not render bit-identically, so a later re-render of
#              a single variant may sound slightly different from the files that
#              are already rendered - the .json sidecar (which records model and
#              voice) is what protects an existing file, not the model id.
#     voice    Cartesia voice id (not a name);
#              `soundctl tts voices --engine cartesia` lists them. Cartesia has
#              no stability/style knobs.
#
# The text is sent to the selected engine and the returned 16 kHz audio is
# normalised and encoded by ffmpeg. An API key is never part of this file: it
# comes from --api-key, --api-key-file, $ELEVENLABS_API_KEY / $CARTESIA_API_KEY
# or /data/sounds/.elevenlabs.key / /data/sounds/.cartesia.key (first hit wins).
# Without a key the robot logs it, skips the render and still syncs what it has.
#
# MP3 file naming convention (see sounds/README.md):
#   <lang>_<name>_<n>.mp3  text announcements (en_, de_, ...)
#   zz_<name>.mp3          background sounds (sort last)
#
# MP3 files MUST be 16 kHz mono — the firmware does NOT resample!

version: 1
language: sv
sound_path: /opt/open_mower_ros/sounds

# Defaults for every tts variant (see the file header).
tts:
  engine: elevenlabs
  bitrate: 32k
  loudnorm: true

  cartesia:
    model: sonic-3.6
    voice: b7187e84-fe22-4344-ba4a-bc013fcb533e # Sebastian

  elevenlabs:
    model: eleven_v4
    voice: iP95p4xoKVk53GoZ742B # Chris (sv supported voice)
    stability: 0.5 # 0..1, lower = more expressive
    similarity_boost: 0.75 # 0..1
    style: 0.0 # 0..1, 0 = the voice's own delivery
    use_speaker_boost: true

# Only the sounds listed here replace the LL ROM default; everything else
# falls back to the firmware default.
#
sounds:
  # FW stage1: Waiting for stage2 ping
  boot_ping:
    type: mp3
    volume: 80
    repeat_ms: 4000
    variants:
      - { file: zz_ping.mp3 }
  # FW stage2 boot completed.
  boot_complete:
    type: mp3
    volume: 90
    pause_after_ms: 1000
    pick: random
    variants:
      - "Hej, jag är din intelligenta OpenMower-gräsklippare. Gräsvård är mitt yrke."
      - "Hej, jag är din intelligenta OpenMower-gräsklippare. [enjoyable]Jag älskar att äta gräs."
      - "Hej, jag är din intelligenta OpenMower-gräsklippare. Firmwaren kör, jag håller på att vakna."
      - "Hej, jag är din intelligenta OpenMower-gräsklippare. Hjärnan startar fortfarande… men grundfunktionerna fungerar."
      - "Hej, jag är din intelligenta OpenMower-gräsklippare. Hårdvaran kör, förståndet laddas fortfarande."
  emergency:
    type: mp3
    volume: 100
    variants:
      - { file: zz_minion-fire-alarm.mp3 }
  emergency_cleared:
    type: mp3
    volume: 90
    pause_after_ms: 500
    variants:
      - "Allt är bra igen. Jag fortsätter."
      - "Problemet är löst. Fri väg."
      - "Ingen fara, jag fortsätter."
      - "Tack, jag känner mig fri igen."
      - "Okej, jag kan fortsätta arbeta."
  ros_connected:
    type: mp3
    volume: 90
    pause_after_ms: 1000
    variants:
      - "Robotens operativsystem har startat."
      - "Robotens operativsystem har startat. Förståndet är också laddat nu."
      - "Robotens operativsystem har startat. Alla system är online."
  ros_disconnected:
    type: mp3
    volume: 90
    pause_after_ms: 1000
    variants:
      - "Robotens operativsystem har stoppats."
      - "Robotens operativsystem har stoppats. Vi ses nästa gång."
      - "Robotens operativsystem har stoppats. Gräset hade tur idag."
  charging_start:
    type: mp3
    volume: 90
    variants:
      - "Laddning startad."
      - "Laddstationen nådd. Jag tankar el nu."
      - "Jag är vid laddstationen. El i stället för gräs — det är också rätt skönt."
      - "Dockad. Jag laddar. Det är den tråkigaste delen av mitt yrke."
      - "Laddstationen nådd. Jag tar en paus — av yrkesmässiga skäl."
  charging_done:
    type: mp3
    volume: 90
    variants:
      - "Batteriet fullt. Laddningen klar."
      - "Batteriet fullt. Jag är hungrig igen — på gräs."
      - "Batteriet fullt. Jag känner mig som ny."
      - "Fulltankad. Jag är redo för nästa runda."
      - "Fulladdad. Nu är det slut på lugnet."
      - "Jag är full igen, [amused]men inte så full att jag inte hittar vägen."
  lift_triggered:
    type: mp3
    volume: 95
    pause_after_ms: 500
    variants:
      - "Lyftsensorn utlöst. Ställ mig tillbaka på gräsmattan, tack."
      - "Jag blev lyft. Sätt ner mig, tack."
      - "Oj, det var visst en mullvadshög."
      - "Jag kan inte flyga. Sätt ner mig igen, tack."
      - "Upplyft — jag behöver markkontakt."
  collision_triggered:
    type: mp3
    volume: 95
    pause_after_ms: 500
    variants:
      - "Kollisionssensorn utlöst."
      - "Jag stötte emot något."
      - "Oj, det passade visst inte."
      - "Nästa gång tar jag mer fart. Jag lovar."
      - "Aj. Det låg visst något i vägen."
  mower_rpm_limit:
    type: mp3
    volume: 95
    pause_after_ms: 500
    variants:
      - "Klippaggregatet går för fort. Jag har stannat det."
      - "Varvtalet var för högt. Kontrollera klippaggregatet, tack."
  mower_rpm_timeout:
    type: mp3
    volume: 95
    pause_after_ms: 500
    variants:
      - "Klippaggregatet går för långsamt. Kontrollera kniven, tack."
      - "Kniven roterar för långsamt. Något har fastnat."
      - "Jag kommer inte upp i varv. Frigör klippaggregatet, tack."
      - "Något har fastnat. Det är inte mitt fel."
  stop_button:
    type: mp3
    volume: 90
    pause_after_ms: 500
    variants:
      - "Stoppknappen intryckad."
      - "Allt stoppat, som du ville."
      - "Okej, jag stannar."
      - "Jag står redan still."
      - "Oj, vad händer?"
  autonomous_notice:
    type: mp3
    volume: 90
    pick: random
    variants:
      - "Se upp, robotgräsklipparen startar nu. Håll avstånd, tack."
      - "Akta, jag klipper nu. Stå inte i vägen, tack."
      - "Jag startar mitt klippuppdrag. Ta ett steg åt sidan, tack."
      - "Robotgräsklippare i drift. Håll dig utanför klippytan, tack."
  mowing_start:
    type: mp3
    volume: 90
    pick: random
    variants:
      - { file: zz_pink-panther.mp3 }
      - { file: zz_highway-to-hell.mp3 }
  mowing_paused:
    type: mp3
    volume: 90
    pick: random
    variants:
      - "Klippuppdraget pausat. Jag väntar på nya instruktioner."
      - "Klippuppdraget pausat. Dags för en tupplur."
  mowing_resumed:
    type: mp3
    volume: 90
    pick: random
    variants:
      - "Och så fortsätter vi."
      - "Klippuppdraget återupptaget. Jag är igång igen."
      - "Hipp hipp hurra… nej, robotgräsklippare! Jag fortsätter klippa."
  docking_start:
    type: mp3
    volume: 90
    pick: random
    variants:
      - "Klippuppdraget klart. Jag beger mig hemåt."
      - "Arbetsdagen är slut. Jag kör tillbaka och tankar el."
      - "Jag är klar med klippningen och kör och laddar nu."
      - { file: zz_coming-home.mp3 }
      - { file: zz_coming-home-remix.mp3 }
      - { file: zz_sweet-home-alabama.mp3 }
  rain_detected:
    type: mp3
    volume: 90
    pick: random
    variants:
      - { file: zz_rain-singing.mp3 }
      - { file: zz_rain-supertramp.mp3 }
      - { file: zz_rain-garbage.mp3 }
  gps_rtk_fix:
    type: mp3
    volume: 100
    pause_after_ms: 500
    variants:
      - { file: zz_gps-rtk-fix.mp3 }
  gps_rtk_lost:
    type: mp3
    volume: 100
    pause_after_ms: 500
    variants:
      - { file: zz_gps-rtk-lost.mp3 }

  area_recording_mode:
    type: mp3
    volume: 90
    pick: random
    variants:
      - "Inspelningsläge aktivt. Visa mig vad jag ska klippa."
      - "Jag lär mig ytan nu. Kör längs kanten, tack."

  # Background effects while the mower works on its own. The low level rolls once
  # per `every` interval and plays one take with `chance` probability.
  mowing_ambience:
    type: mp3
    volume: 90
    pick: random
    every: 60s
    chance: 0.3
    variants:
      - { file: zz_cow.mp3 }
      - { file: zz_sheep.mp3 }
      - { file: zz_burp.mp3 }
      - { file: zz_fart-wet.mp3 }
      - { file: zz_fart-vegan.mp3 }
      - { file: zz_minion-fart.mp3 }
